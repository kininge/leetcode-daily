    <rect x="0" y="0" width="233.54314720812184" height="20" fill="#1cbaba" rx="4" /> 
    <rect x="237.54314720812184" y="0" width="285.4416243654822" height="20" fill="#ffb700" rx="4" />
    <rect x="526.984771573604" y="0" width="49.015228426395936" height="20" fill="#f63737" rx="4" />
  </g>
