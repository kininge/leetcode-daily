    <rect x="0" y="0" width="238.2829268292683" height="20" fill="#1cbaba" rx="4" /> 
    <rect x="242.2829268292683" y="0" width="279.84390243902436" height="20" fill="#ffb700" rx="4" />
    <rect x="526.1268292682927" y="0" width="49.87317073170731" height="20" fill="#f63737" rx="4" />
